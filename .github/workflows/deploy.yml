name: Deploy Portfolio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # <--- THIS creates the manual "Run workflow" button!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (if using Vite/React)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Uncomment below if you use npm build (like React/Vite)
      # - name: Install and Build
      #   run: |
      #     npm install
      #     npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Change to './dist' if using Vite/React build output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
